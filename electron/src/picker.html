<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Escolha o que compartilhar</title>
<style>
  /* Mesma paleta/linguagem do site (public/style.css) — pedido do usuário:
     "a do site tá muito mais bonita" (ver HANDOFF §34). Sem fontes externas
     de propósito, igual ao update.html: janela utilitária que tem que
     desenhar na hora, sem esperar rede. Janela sem moldura do Windows
     (frame:false em main.js) — o cabeçalho abaixo é a barra de arrastar. */
  :root{
    --void:#0b0c0e; --panel:#17191c; --panel-2:#1f2225; --line:#2b2e33;
    --ink:#eef1f0; --fog:#888d90; --rec:#ff4438; --tune:#ffb020; --tune-dim:#ffb02022;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; height:100vh; overflow:hidden; color:var(--ink);
    background:
      radial-gradient(ellipse 600px 260px at 10% -10%, #1a1512 0%, transparent 62%),
      var(--void);
    font-family:'Segoe UI', system-ui, sans-serif; font-size:13px;
    display:flex; flex-direction:column; border:1px solid var(--line);
  }
  .mono{ font-family:'JetBrains Mono', Consolas, monospace; }
  .section-label{
    font-family:'JetBrains Mono', Consolas, monospace; font-size:10.5px; letter-spacing:2px;
    text-transform:uppercase; color:var(--fog); margin:0 0 8px;
  }

  /* Cabeçalho = barra de arrastar */
  header{
    -webkit-app-region:drag; flex-shrink:0;
    display:flex; align-items:center; gap:10px; padding:14px 14px 12px 18px;
    border-bottom:1px solid var(--line);
  }
  .rec-led{ width:8px; height:8px; border-radius:50%; background:var(--rec); box-shadow:0 0 0 3px #ff443822; }
  .wordmark{ font-size:17px; font-weight:800; letter-spacing:3px; text-transform:uppercase; }
  .header-title{ color:var(--fog); font-size:11px; letter-spacing:2px; text-transform:uppercase; margin-left:4px; }
  #closeBtn{
    -webkit-app-region:no-drag; margin-left:auto; width:30px; height:30px; padding:0;
    display:flex; align-items:center; justify-content:center; border-radius:6px;
    background:transparent; border:1px solid transparent; color:var(--fog); cursor:pointer;
  }
  #closeBtn:hover{ color:var(--ink); background:var(--panel-2); border-color:var(--line); }

  main{ flex:1; display:flex; flex-direction:column; padding:16px 18px 0; min-height:0; }

  /* Qualidade — mesmos nomes e textos do menu do site */
  #quality{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:18px; }
  .quality-option{
    display:flex; flex-direction:column; align-items:flex-start; gap:3px; text-align:left;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; color:var(--ink); cursor:pointer; font-family:inherit; transition:.12s;
  }
  .quality-option:hover:not(:disabled):not(.selected){ border-color:#4a4e55; background:var(--panel-2); }
  .quality-option .name{ font-size:14px; font-weight:600; }
  .quality-option .desc{ font-size:11px; color:var(--fog); letter-spacing:.3px; white-space:nowrap; }
  .quality-option.selected{ border-color:var(--tune); background:var(--tune-dim); }
  .quality-option.selected .name{ color:var(--tune); }
  .quality-option:disabled{ opacity:.4; cursor:not-allowed; }

  /* Fontes */
  #grid{
    flex:1; display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; align-content:start;
  }
  .source{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    cursor:pointer; overflow:hidden; text-align:left; padding:0; color:var(--ink);
    display:flex; flex-direction:column; transition:.12s; font-family:inherit;
  }
  .source:hover, .source:focus-visible{ border-color:var(--tune); outline:none; }
  .source:hover .label{ color:var(--tune); }
  .source img{ width:100%; height:96px; object-fit:contain; background:#000; display:block; }
  .source .label{ padding:8px 10px 2px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .source .tag{
    font-family:'JetBrains Mono', Consolas, monospace; font-size:9.5px; letter-spacing:1.5px;
    color:var(--fog); text-transform:uppercase; padding:0 10px 9px;
  }
  #empty{ color:var(--fog); padding:30px; text-align:center; grid-column:1/-1; }

  footer{
    padding:12px 18px; flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .btn{
    background:transparent; color:var(--fog); border:1px solid var(--line); border-radius:7px;
    padding:8px 16px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn:hover{ color:var(--ink); border-color:var(--fog); }
  /* Paginação — 6 fontes por página (pedido do usuário: com 7+ apertadas
     na mesma tela ficava difícil achar a certa). */
  #pagination{ display:flex; gap:6px; }
  #pagination button{
    width:28px; height:28px; padding:0; font-size:12px; border-radius:6px; cursor:pointer;
    background:transparent; color:var(--fog); border:1px solid var(--line);
    font-family:'JetBrains Mono', Consolas, monospace;
  }
  #pagination button:hover{ color:var(--ink); border-color:var(--fog); }
  #pagination button.current{ background:var(--tune); border-color:var(--tune); color:#1a1200; font-weight:700; }
</style>
</head>
<body>
<header>
  <span class="rec-led"></span>
  <span class="wordmark">Sinal</span>
  <span class="header-title">Escolha o que compartilhar</span>
  <button type="button" id="closeBtn" title="Cancelar" aria-label="Cancelar">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
  </button>
</header>
<main>
  <div class="section-label">Qualidade</div>
  <div id="quality" role="radiogroup" aria-label="Qualidade da transmissão"></div>
  <div class="section-label">Telas e janelas abertas</div>
  <div id="grid"><div id="empty">Carregando...</div></div>
</main>
<footer>
  <div id="pagination" hidden></div>
  <button type="button" class="btn" id="cancelBtn">Cancelar</button>
</footer>
<script>
  // window.pickerAPI vem do picker-preload.js (contextBridge) — essa janela
  // nunca carrega o site do Sinal, então não precisa (nem deve) ter acesso a
  // nada além disso.
  const PAGE_SIZE = 6;
  let allSources = [];
  let currentPage = 0;

  // Mesmos nomes e textos do menu do site (SHARE_QUALITY_PRESETS em
  // public/app.js) — se mudar lá, mudar aqui também.
  const QUALITIES = [
    { key: 'leve', name: 'Leve', desc: '720p · 30fps — upload fraco' },
    { key: 'nitido', name: 'Nítido', desc: '1080p · 30fps — texto e vídeo' },
    { key: 'fluido', name: 'Fluido', desc: '1080p · 60fps — jogos', requiresH265: true }
  ];
  // Fluido só com codificador H.265 por hardware — o Chromium só lista H.265
  // nos codecs de envio quando existe (mesma checagem do supportsH265() do
  // LiveKit que o site usa).
  const canSendH265 = (() => {
    try{ return RTCRtpSender.getCapabilities('video').codecs.some((c) => /h265|hevc/i.test(c.mimeType)); }
    catch(e){ return false; }
  })();
  let quality = 'nitido';

  function renderQuality(){
    const box = document.getElementById('quality');
    box.innerHTML = '';
    QUALITIES.forEach((q) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'quality-option';
      btn.setAttribute('role', 'radio');
      btn.setAttribute('aria-checked', String(q.key === quality));
      if(q.key === quality) btn.classList.add('selected');
      const unavailable = q.requiresH265 && !canSendH265;
      btn.disabled = unavailable;
      btn.title = unavailable ? 'Precisa de uma placa de vídeo com codificador H.265 — este PC não tem' : '';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = q.name;
      const desc = document.createElement('span');
      desc.className = 'desc mono';
      desc.textContent = q.desc;
      btn.append(name, desc);
      btn.addEventListener('click', () => { quality = q.key; renderQuality(); });
      box.appendChild(btn);
    });
  }

  function renderGrid(){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    if(!allSources.length){
      grid.innerHTML = '<div id="empty">Nada disponível pra compartilhar agora.</div>';
      return;
    }
    const start = currentPage * PAGE_SIZE;
    allSources.slice(start, start + PAGE_SIZE).forEach((s) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'source';
      // s.name vem do próprio Windows/Electron (título de janela/monitor),
      // não de outro participante da sala — mas monta via DOM mesmo assim.
      const img = document.createElement('img');
      img.src = s.thumbnailDataUrl;
      img.alt = '';
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = s.name || (s.isScreen ? 'Tela' : 'Janela');
      // title = tooltip nativo com o nome completo, pra quando trunca.
      label.title = label.textContent;
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = s.isScreen ? 'Tela inteira' : 'Janela';
      btn.append(img, label, tag);
      btn.addEventListener('click', () => window.pickerAPI.choose(s.id, quality));
      grid.appendChild(btn);
    });
  }

  function renderPagination(){
    const totalPages = Math.ceil(allSources.length / PAGE_SIZE);
    const pag = document.getElementById('pagination');
    pag.innerHTML = '';
    if(totalPages <= 1){ pag.hidden = true; return; }
    pag.hidden = false;
    for(let i = 0; i < totalPages; i++){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = String(i + 1);
      if(i === currentPage) btn.classList.add('current');
      btn.addEventListener('click', () => { currentPage = i; renderGrid(); renderPagination(); });
      pag.appendChild(btn);
    }
  }

  window.pickerAPI.onSources(({ sources, quality: saved }) => {
    const valid = QUALITIES.find((q) => q.key === saved);
    quality = valid && !(valid.requiresH265 && !canSendH265) ? saved : 'nitido';
    renderQuality();
    allSources = sources;
    currentPage = 0;
    renderGrid();
    renderPagination();
  });

  document.getElementById('cancelBtn').addEventListener('click', () => window.pickerAPI.cancel());
  document.getElementById('closeBtn').addEventListener('click', () => window.pickerAPI.cancel());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.pickerAPI.cancel(); });
</script>
</body>
</html>
