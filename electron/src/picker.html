<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Escolha o que compartilhar</title>
<style>
  /* Visual simples, combinando com a paleta escura do Sinal — não precisa
     ser bonito, é uma janela utilitária que aparece por segundos. */
  :root{ --bg:#0b0c0e; --panel:#16181c; --line:#2a2d33; --ink:#eef0f2; --fog:#9aa0a8; --tune:#5865f2; }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Segoe UI', system-ui, sans-serif; font-size:13px;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{ padding:14px 16px 8px; border-bottom:1px solid var(--line); flex-shrink:0; }
  header h1{ margin:0; font-size:15px; font-weight:600; }
  header p{ margin:4px 0 0; color:var(--fog); font-size:12px; }
  #grid{
    flex:1; padding:14px 16px;
    display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;
    align-content:start;
  }
  .source{
    background:var(--panel); border:2px solid var(--line); border-radius:8px;
    cursor:pointer; overflow:hidden; text-align:left; padding:0;
    display:flex; flex-direction:column; transition:border-color .1s;
  }
  .source:hover, .source:focus-visible{ border-color:var(--tune); outline:none; }
  .source img{ width:100%; height:90px; object-fit:contain; background:#000; display:block; }
  .source .label{ padding:6px 8px; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .source .tag{ font-size:9px; color:var(--fog); text-transform:uppercase; letter-spacing:.04em; padding:0 8px 6px; }
  footer{
    padding:10px 16px; border-top:1px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  button{
    background:transparent; color:var(--fog); border:1px solid var(--line); border-radius:6px;
    padding:7px 14px; font-size:12px; cursor:pointer;
  }
  button:hover{ color:var(--ink); border-color:var(--fog); }
  #empty{ color:var(--fog); padding:20px; text-align:center; grid-column:1/-1; }
  /* Paginação — 6 fontes por página (o tanto que já cabia bem, 2 linhas de
     3, sem apertar nada) em vez de espremer miniatura+texto pra caber tudo
     de uma vez quando tem muita coisa aberta (pedido do usuário: difícil
     de identificar a fonte certa com 7+ apertadas na mesma tela). */
  #pagination{ display:flex; gap:6px; }
  #pagination button{
    width:26px; height:26px; padding:0; font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }
  #pagination button.current{ background:var(--tune); border-color:var(--tune); color:#0b0c0e; font-weight:700; }
</style>
</head>
<body>
<header>
  <h1>Escolha o que compartilhar</h1>
  <p>Telas e janelas abertas agora.</p>
</header>
<div id="grid"><div id="empty">Carregando...</div></div>
<footer>
  <div id="pagination" hidden></div>
  <button type="button" id="cancelBtn">Cancelar</button>
</footer>
<script>
  // window.pickerAPI vem do picker-preload.js (contextBridge) — essa janela
  // nunca carrega o site do Sinal, então não precisa (nem deve) ter acesso a
  // nada além disso.
  const PAGE_SIZE = 6;
  let allSources = [];
  let currentPage = 0;

  function renderGrid(){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    if(!allSources.length){
      grid.innerHTML = '<div id="empty">Nada disponível pra compartilhar agora.</div>';
      return;
    }
    const start = currentPage * PAGE_SIZE;
    allSources.slice(start, start + PAGE_SIZE).forEach((s) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'source';
      // s.name vem do próprio Windows/Electron (título de janela/monitor),
      // não de outro participante da sala — mas monta via DOM mesmo assim,
      // é hábito bom e mais barato que puxar escapeHtml aqui.
      const img = document.createElement('img');
      img.src = s.thumbnailDataUrl;
      img.alt = '';
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = s.name || (s.isScreen ? 'Tela' : 'Janela');
      // title = tooltip nativo com o nome completo, pra quando o texto
      // trunca (elipse) por ser mais longo que a largura do card.
      label.title = label.textContent;
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = s.isScreen ? 'Tela inteira' : 'Janela';
      btn.append(img, label, tag);
      btn.addEventListener('click', () => window.pickerAPI.choose(s.id));
      grid.appendChild(btn);
    });
  }

  function renderPagination(){
    const totalPages = Math.ceil(allSources.length / PAGE_SIZE);
    const pag = document.getElementById('pagination');
    pag.innerHTML = '';
    if(totalPages <= 1){ pag.hidden = true; return; }
    pag.hidden = false;
    for(let i = 0; i < totalPages; i++){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = String(i + 1);
      if(i === currentPage) btn.classList.add('current');
      btn.addEventListener('click', () => { currentPage = i; renderGrid(); renderPagination(); });
      pag.appendChild(btn);
    }
  }

  window.pickerAPI.onSources((sources) => {
    allSources = sources;
    currentPage = 0;
    renderGrid();
    renderPagination();
  });

  document.getElementById('cancelBtn').addEventListener('click', () => window.pickerAPI.cancel());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.pickerAPI.cancel(); });
</script>
</body>
</html>
