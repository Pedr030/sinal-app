<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Aviso do Sinal</title>
<style>
  /* Aviso no canto superior da tela (main.js, HANDOFF §69): mesma paleta do update.html. Janela transparente, sem
     foco, só o cartão aparece. Texto FIXO aqui: nada vem do site. */
  :root{ --panel:rgba(23,25,28,.92); --line:#2b2e33; --ink:#eef1f0; --fog:#888d90; --muted:#aab0b3; --tune:#ffb020; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:transparent; overflow:hidden; user-select:none; }
  body{ font-family:'Segoe UI', system-ui, sans-serif; padding:14px; }
  .card{
    display:flex; gap:11px; align-items:flex-start; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--tune);
    border-radius:10px; padding:11px 12px; color:var(--ink);
    box-shadow:0 6px 16px rgba(0,0,0,.45);
    opacity:0; transform:translateY(-6px); transition:opacity .25s ease, transform .25s ease;
  }
  .card.in{ opacity:1; transform:none; }
  .card.out{ opacity:0; transition:opacity .4s ease; }
  .rec{ width:9px; height:9px; border-radius:50%; background:#ff4438; margin-top:5px; flex-shrink:0; box-shadow:0 0 0 3px #ff443822; }
  .txt{ flex:1; min-width:0; }
  .t{ font-weight:700; font-size:13px; line-height:1.3; }
  .b{ font-size:12px; color:var(--muted); line-height:1.4; margin-top:2px; }
  .act{ margin-top:7px; font-size:12px; font-weight:600; color:var(--tune); }
  .card:hover .act{ text-decoration:underline; }
  .x{ background:none; border:0; padding:2px; margin:-2px -2px 0 0; color:var(--fog); cursor:pointer; display:flex; border-radius:4px; }
  .x:hover{ color:var(--ink); background:rgba(255,255,255,.08); }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="rec"></div>
    <div class="txt">
      <div class="t">Sua transmissão está perdendo quadros</div>
      <div class="b">A captura pela placa de vídeo pode ajudar.</div>
      <div class="act">Clique para ver</div>
    </div>
    <button class="x" id="close" type="button" title="Fechar" aria-label="Fechar">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
    </button>
  </div>
<script>
  // Some sozinho depois de alguns segundos; com o mouse em cima, espera.
  const SHOW_MS = 8000;
  const card = document.getElementById('card');
  let timer = null;
  let leaving = false;
  function leave(choice){
    if(leaving) return;
    leaving = true;
    clearTimeout(timer);
    if(choice === 'open'){ window.hintAPI.open(); return; }
    card.classList.add('out');
    setTimeout(() => window.hintAPI.close(), 420);
  }
  function arm(){ clearTimeout(timer); timer = setTimeout(() => leave('close'), SHOW_MS); }
  card.addEventListener('mouseenter', () => { window.hintAPI.setMouseOver(true); clearTimeout(timer); });
  card.addEventListener('mouseleave', () => { window.hintAPI.setMouseOver(false); if(!leaving) arm(); });
  card.addEventListener('click', () => leave('open'));
  document.getElementById('close').addEventListener('click', (e) => { e.stopPropagation(); leave('close'); });
  requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('in')));
  arm();
</script>
</body>
</html>
