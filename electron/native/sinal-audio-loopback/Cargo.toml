[package]
name = "sinal-audio-loopback"
version = "0.1.0"
edition = "2021"
license = "MIT"
# Addon nativo N-API que a gente escreveu (não é dependência de terceiro) pra
# capturar áudio do Windows excluindo (ou incluindo só) uma árvore de
# processos específica — ver HANDOFF.md, seção Electron/áudio isolado, pro
# porquê de ser código próprio em vez de um pacote pronto de terceiro.

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4", "error_anyhow"] }
napi-derive = "2"
# #[implement(...)] expande pra caminhos ::windows_core:: absolutos, então
# precisa ser dependência direta (usado no completion handler da ativação
# assíncrona, tanto no lib.rs de produção quanto nos examples/ de diagnóstico
# — ver comentário grande no topo do lib.rs pro porquê da ativação ser
# assíncrona agora).
windows-core = "0.58"

# Só os módulos do Win32 que a gente realmente usa — reduz superfície e tempo
# de compilação. Ver src/lib.rs pra onde cada um é usado.
[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Storage_StructuredStorage",
  "Win32_System_Com",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging",
  "implement",
]

[build-dependencies]
napi-build = "2"
