name: tests

# Roda nos PRs contra main/development e a cada push nelas. Usa só o test
# runner nativo do Node (node --test) — nenhuma dependência nova, nenhum
# serviço pago, nada além do que já está no package.json.
on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

# Só leitura do repositório — o job não precisa escrever em nada, então mesmo que um passo seja
# comprometido o token dele não consegue alterar o repositório.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
